enabled: false

replicaCount: 3

image:
  repository: registry.wenex.org/landau/lnd-frontend
  pullPolicy: IfNotPresent
  tag: "1.0.0"

fullnameOverride: "lnd-frontend"

serviceAccount:
  create: true
  automount: true

service:
  type: ClusterIP
  port: 80
  targetPort: 3105

# The frontend had no probes at all: a wedged Nitro process was never restarted and a starting pod
# took traffic before it could answer. Liveness is a TCP check on purpose — Nuxt exposes no health
# route, and pointing liveness at a rendered page would restart the pod for a render error.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

ingress:
  enabled: false

# **********************
# Workload hardening
# **********************
# Requests are what the scheduler reserves; without them every pod here was BestEffort QoS and so
# the first evicted under node pressure. A memory *limit* is set because a Node heap that runs away
# should be killed rather than take the node with it; a CPU limit deliberately is **not** — CFS
# throttling on a latency-sensitive service is worse than the burst it prevents.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# The subset that is safe whatever the image does. `runAsNonRoot`/`runAsUser` are **not** here on
# purpose: both images build `FROM wenex/node:22-base` (itself `node:22-alpine`) with
# `WORKDIR /app`, `COPY . .` and no `USER`, so they run as root and own /app as root — defaulting to UID 1000 would fail to
# start. Enabling it is a Dockerfile change first. `readOnlyRootFilesystem` likewise needs a
# writable /tmp mounted as an emptyDir before it can be turned on.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# With replicaCount 3 and no budget, a drain could take all three at once.
#
# **`maxUnavailable`, not `minAvailable`.** `minAvailable: 1` looks like the safer guarantee and is
# the classic footgun: at `replicaCount: 1` — a staging install, a trimmed namespace, or autoscaling
# with `minReplicas: 1` — it permits *zero* voluntary evictions, so `kubectl drain` hangs for ever
# and a cluster upgrade stalls. `maxUnavailable: 1` degrades gracefully at any replica count.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: false

environments:
  nuxt:
    # *****************************
    # Logging Services
    # *****************************
    sentry:
      url: ""
      authToken: ""
    # *****************************
    # Public Information
    # *****************************
    public:
      apiBaseUrl: "https://api.landau.ir"
      platformApiBaseUrl: "https://gateway.wenex.org"
      # Landau's tenant domain, sent with every token request. Platform subjects are
      # domain-scoped, and a request without it is rejected with `invalid subjects`.
      authDomain: "landau.ir"
      # *****************************
      # Push Information
      # *****************************
      vapidPublicKey: ""
      # *****************************
      # Security Services
      # *****************************
      altcha:
        challengeUrl: "https://api.landau.ir/challenge"
      # *****************************
      # Client Information
      # *****************************
      appId: ""
      clientId: ""
      # MQTT Over WebSocket
      mqttWsUrl: "wss://emqx.wenex.org/mqtt"
      # *****************************
      # Feature Flags
      # *****************************
      pos:
        # Whether the in-shop POS confirm button is offered. **Must match the backend's
        # `global.environments.order.posEnabled`**: this side only decides whether the button
        # appears, and the backend still refuses a settle with 501 when the two disagree — so
        # `false` here against a POS-enabled backend hides the whole surface with nothing on
        # screen to explain why.
        enabled: true
        # Where the card reader answers, and without it the button above cannot settle anything:
        # a settle must carry the acquirer's own reference, which only a real `purchase` on the
        # bridge produces, so with this empty the screen short-circuits to `unreachable` before
        # it tries.
        #
        # It is the **shop PC's own loopback**, not a cluster address — the reader sits beside the
        # counter while the backend runs on a server, which is the whole reason the swipe is
        # separated from the money. The port is the bridge's, identical on every till, so one
        # value serves every shop. Empty it only where no terminal is placed, and then set
        # `enabled: false` too.
        bridgeUrl: "http://127.0.0.1:4373"
      # *****************************
      # Logging Services
      # *****************************
      sentry:
        dsn: ""
        tracesSampleRate: "0.8"
      # *****************************
      # OAuth Information
      # *****************************
      # Google
      google:
        client:
          id: ""
          scope: "https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile"
          redirectUri: "https://landau.ir/oauth"
      # *****************************
      # OSM Services
      # *****************************
      # Named for the runtimeConfig key it feeds (`mapTileUrl` -> NUXT_PUBLIC_MAP_TILE_URL), so the
      # values key, the env var and the app's own key are one greppable name. It was
      # `mapTileServerPath` feeding NUXT_PUBLIC_MAPTILE_SERVER_PATH, which the app never read at
      # runtime — so nothing can have depended on the old key's behaviour, because it had none.
      mapTileUrl: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
