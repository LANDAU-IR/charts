enabled: false

replicaCount: 3

fullnameOverride: "lnd-services"

serviceAccount:
  create: true
  automount: true

service:
  type: ClusterIP
  port: 80

# **Liveness asks whether the process is alive, and nothing else — so it is a TCP check.**
# `/status` is composite (`HealthModule.forRoot(['redis','nats','service','platform'])`) and answers
# 503 when any of those is down, so using it here restarted every pod whenever Redis, NATS, the
# platform or lnd-services blipped. A restart cures none of them, and turned a partial outage into a
# CrashLoop of the component that was still healthy. A socket that accepts a connection is the most
# this chart can ask without a shallow health route in the app; readiness keeps `/status`, where a
# dead dependency correctly takes the pod out of the Service's endpoints.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /status
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 3

ingress:
  enabled: false

# **********************
# Workload hardening
# **********************
# Requests are what the scheduler reserves; without them every pod here was BestEffort QoS and so
# the first evicted under node pressure. A memory *limit* is set because a Node heap that runs away
# should be killed rather than take the node with it; a CPU limit deliberately is **not** — CFS
# throttling on a latency-sensitive service is worse than the burst it prevents.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# The subset that is safe whatever the image does. `runAsNonRoot`/`runAsUser` are **not** here on
# purpose: both images build `FROM wenex/node:22-base` (itself `node:22-alpine`) with
# `WORKDIR /app`, `COPY . .` and no `USER`, so they run as root and own /app as root — defaulting to UID 1000 would fail to
# start. Enabling it is a Dockerfile change first. `readOnlyRootFilesystem` likewise needs a
# writable /tmp mounted as an emptyDir before it can be turned on.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# With replicaCount 3 and no budget, a drain could take all three at once.
#
# **`maxUnavailable`, not `minAvailable`.** `minAvailable: 1` looks like the safer guarantee and is
# the classic footgun: at `replicaCount: 1` — a staging install, a trimmed namespace, or autoscaling
# with `minReplicas: 1` — it permits *zero* voluntary evictions, so `kubectl drain` hangs for ever
# and a cluster upgrade stalls. `maxUnavailable: 1` degrades gracefully at any replica count.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: false
