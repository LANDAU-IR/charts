replicaCount: 3

fullnameOverride: "lnd-gateway"

serviceAccount:
  create: true
  automount: true

service:
  type: ClusterIP
  port: 80
  targetPort: 6150

# **Liveness asks whether the process is alive, and nothing else — so it is a TCP check.**
# `/status` is composite (`HealthModule.forRoot(['redis','nats','service','platform'])`) and answers
# 503 when any of those is down, so using it here restarted every pod whenever Redis, NATS, the
# platform or lnd-services blipped. A restart cures none of them, and turned a partial outage into a
# CrashLoop of the component that was still healthy. A socket that accepts a connection is the most
# this chart can ask without a shallow health route in the app; readiness keeps `/status`, where a
# dead dependency correctly takes the pod out of the Service's endpoints.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /status
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 3

ingress:
  enabled: false

# **********************
# Workload hardening
# **********************
# Requests are what the scheduler reserves; without them every pod here was BestEffort QoS and so
# the first evicted under node pressure. A memory *limit* is set because a Node heap that runs away
# should be killed rather than take the node with it; a CPU limit deliberately is **not** — CFS
# throttling on a latency-sensitive service is worse than the burst it prevents.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# The subset that is safe whatever the image does. `runAsNonRoot`/`runAsUser` are **not** here on
# purpose: both images build `FROM wenex/node:22-base` (itself `node:22-alpine`) with
# `WORKDIR /app`, `COPY . .` and no `USER`, so they run as root and own /app as root — defaulting to UID 1000 would fail to
# start. Enabling it is a Dockerfile change first. `readOnlyRootFilesystem` likewise needs a
# writable /tmp mounted as an emptyDir before it can be turned on.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# With replicaCount 3 and no budget, a drain could take all three at once.
#
# **`maxUnavailable`, not `minAvailable`.** `minAvailable: 1` looks like the safer guarantee and is
# the classic footgun: at `replicaCount: 1` — a staging install, a trimmed namespace, or autoscaling
# with `minReplicas: 1` — it permits *zero* voluntary evictions, so `kubectl drain` hangs for ever
# and a cluster upgrade stalls. `maxUnavailable: 1` degrades gracefully at any replica count.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

autoscaling:
  enabled: false

global:
  image:
    repository: registry.wenex.org/landau/client-backend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  imagePullSecrets: []
  # **********************
  # Secrets
  # **********************
  secrets:
    aes: "" # default: random 64 chars
    altcha:
      hmacKey: "" # default: random 64 chars
    # The HMAC key the PSP callback's own signature is checked against. ZarinPal signs nothing on
    # the way back, so this is the only thing that tells a genuine return from a typed one, and the
    # backend refuses to boot on the placeholders the repository ships.
    psp:
      secret: "" # default: random 64 chars
    # Web-push keypair. Deliberately **not** generated: a random string is not a valid VAPID key,
    # and the backend's own fallback pair is committed, hence public. Mint one with
    # `npx web-push generate-vapid-keys` and set both halves — the public one under
    # `global.environments.vapid.publicKey`, which the frontend chart needs too. Left empty, the
    # backend keeps its public dev pair.
    vapid:
      privateKey: ""
    # Only read by `pnpm platform:seed`, run by hand against a pod; the running apps never see it.
    # Empty leaves the seed's own `admin`.
    init:
      adminPassword: ""
  # **********************
  # Environment Variables
  # **********************
  environments:
    # Namespaces for the `debug` package. Empty ships quiet: `clt:*` logs every request, which in
    # production is both noise and a disclosure. The template emits nothing when this is empty.
    debug: ""
    timeout: "90000"
    # **`production`, and it is not cosmetic.** `NODE_ENV().IS_DEV` decides whether an HTTP error
    # reply carries `stack` and `data` (all-exceptions.filter.ts), so `develop` — what this chart
    # shipped until 2026-09-07 — returns stack traces to any caller that can provoke a 500.
    #
    # It also arms `apps/*/src/main.ts`'s production branch, which **throws at boot** unless
    # `ELASTIC_APM_SERVICE_NAME` is set. Every deployment template here sets it per service, so the
    # umbrella is safe as shipped; a values file that strips it will not boot.
    nodeEnv: "production"
    # GraphQl mutation support
    graphqlMutationSupport: false
    # **********************
    # Internationalization
    # **********************
    locale: "fa"
    region: "IR"
    tz: "Asia/Tehran"
    # **********************
    # Messaging Config
    # **********************
    # Kavenegar
    kavenegar:
      senders: ""
      apiKey: ""
    # Melipayamak
    melipayamak:
      user: ""
      pass: ""
      from: ""
    # **********************
    # IPG Config
    # **********************
    # The defaults below are ZarinPal's **sandbox**. A deployment that means to take real money
    # names the production `url` and `redirectUrl` explicitly and carries its own `merchantId`.
    zarinpal:
      # **The sandbox host stays the default on purpose** — `zarinpal.env.ts` states the rule this
      # chart follows: "a deployment that has not been given a merchant id must not silently take
      # money, and a deployment that has one is naming the production URL explicitly". So taking
      # real money is three deliberate values — `url`, `redirectUrl` and `merchantId` — never one.
      url: "https://sandbox.zarinpal.com/pg/v4"
      # Empty since 2026-09-07. This shipped a **working sandbox merchant id**, so an install that
      # believed itself production processed fake payments that looked entirely successful.
      merchantId: ""
      # A fallback the backend never reads today — `psp.callbackUrl` below is what the adapter is
      # handed per attempt. Kept in step with it on purpose: a value that disagreed would only be
      # here to mislead the next operator.
      callbackUrl: "https://api.landau.ir/shopping/payments/callback"
      redirectUrl: "https://sandbox.zarinpal.com/pg/StartPay/{}"
      timeoutMs: "20000"
    # **********************
    # PSP Config
    # **********************
    # Which adapter answers, and where money comes back to. `zarinpal` is the real one; `dev` is the
    # built-in fake, and selecting it also takes `allowFake: true` so it cannot be reached by
    # omission — the fake verifies Landau's own payments with no bank in the loop. An unknown name
    # refuses to boot rather than falling back.
    psp:
      provider: "zarinpal"
      allowFake: false
      # Only for a provider that is not ZarinPal, which reads `zarinpal.merchantId` above. Empty
      # leaves the backend's own default.
      merchantId: ""
      # Landau's own public callback route, on the gateway — not the frontend's. The wholesale
      # callback is derived from this one's origin, so there is nothing else to keep in step.
      callbackUrl: "https://api.landau.ir/shopping/payments/callback"
      # How long the payer has at the provider before the saga reaps the attempt, in seconds.
      timeoutSeconds: "900"
    # **********************
    # Landau Config
    # **********************
    landau:
      userId: "68fc7a3dbe2e2c2d7fa9d055"
    # **********************
    # Order Config
    # **********************
    order:
      # How long a shop has to answer a paid order before it is auto-rejected and refunded.
      autoRejectHours: "48"
      # How long after delivery a buyer may still raise a dispute.
      disputeWindowDays: "7"
      # A shop's order against its own stock confirms itself; `false` restores the manual step.
      selfSupplyAutoConfirm: true
      # The in-shop card terminal. **Must match `frontend.environments.nuxt.public.posEnabled`**:
      # this side decides whether a settle is accepted at all, and with the two disagreeing the
      # backend answers 501 to a button the browser has already offered. A deployment that places
      # no terminals says so here *and* there.
      posEnabled: true
      # How much settled-but-unreconciled POS money one shop may carry before further settles are
      # refused, in the smallest currency unit.
      posUnreconciledCeiling: "5000000000"
      # Whether the swipe moves the money, or only records the acquirer's reference for the shop to
      # reconcile later. `false` restores [decision 108] exactly. Added 2026-09-07 — the backend has
      # read `ORDER_POS_AUTO_RECONCILE` since plan 82 and this chart did not carry it.
      posAutoReconcile: true
    # **********************
    # Dispatch Config
    # **********************
    dispatch:
      # How far from a pickup a courier may be and still be offered the job.
      radiusKm: "50"
      # Great-circle kilometres are multiplied by this to price a real road route.
      detourFactor: "1.4"
      # How long one offer wave stands before the next widens.
      waveMinutes: "10"
      # After this long with no ping a courier's position stops counting as live.
      positionTtlMinutes: "30"
      routingCosting: "auto"
      routingPool: "24"
      # Whether a carrier must hold a funded guarantee before being offered a job. Fail-open,
      # matching the backend's own default: with it off no candidate is dropped for want of cover.
      # Added 2026-09-07 — the backend has read `DISPATCH_REQUIRE_GUARANTEE` since plan 84.
      requireGuarantee: false
      # What a consignment is assumed to be when the shop declares nothing.
      default:
        weightKg: "5"
        widthCm: "30"
        heightCm: "30"
        lengthCm: "30"
    # **********************
    # Operations Config
    # **********************
    # The sweep that drives offer waves and auto-rejects, and the lock that keeps one replica on it.
    operations:
      tickSeconds: "60"
      lockSeconds: "300"
    # **********************
    # Wholesale Config
    # **********************
    # Payment terms for a distributor who has never declared its own.
    wholesale:
      restockTermsDays: "30"
    # **********************
    # Client Config
    # **********************
    strictToken: true
    # Client
    uid: ""
    cid: ""
    appId: ""
    clientId: ""
    clientSecret: ""
    # Platform
    root:
      domain: "landau.ir"
      subject: "root@landau.ir"
    platformUrl: "http://platform-gateway.wenex-platform.svc.cluster.local"
    # Backend
    backend:
      authorizationCqrs: ""
    apiKey: ""
    # Frontend
    frontend:
      baseUrl: "https://landau.ir"
      assetsUrl: "https://assets.landau.ir"
    # **********************
    # Captcha Services
    # **********************
    # Altcha — the proof-of-work ceiling. Its HMAC key is a secret: `global.secrets.altcha.hmacKey`.
    altcha:
      maxNumber: "100000"
    # **********************
    # Push Information
    # **********************
    # VAPID — the public half only, and the same value the frontend chart serves to the browser.
    # The private half is a secret: `global.secrets.vapid.privateKey`. Set both or neither.
    vapid:
      publicKey: ""
    # **********************
    # Mail Identities
    # **********************
    # Empty keeps the backend's own `Landau <no-reply@$ROOT_DOMAIN>` and `support@$ROOT_DOMAIN`.
    mail:
      noReply: ""
      support: ""
    # **********************
    # Logging Services
    # **********************
    # Sentry
    sentry:
      dsn: ""
      maxBreadcrumbs: "100"
      # 0.8 traces four in five requests, which is a development figure; the frontend subchart's
      # own template already defaults to 0.1.
      tracesSampleRate: "0.1"
    # **********************
    # Storage Services
    # **********************
    # Redis
    redis:
      host: "redis-stack-master.redis.svc.cluster.local"
      port: 6379
      prefix: "lnd"
      password: ""
    # Mongo
    mongo:
      host: "psmdb-server-psmdb-db-rs0.mongodb.svc.cluster.local"
      db: "landau"
      prefix: "lnd"
      user: "databaseAdmin"
      pass: ""
      query: "replicaSet=rs0&retryWrites=true&authSource=admin"
    # **********************
    # Broker Services
    # **********************
    # Nats
    nats:
      # Empty since 2026-09-07: `lnd`/`lnd` was a credential committed to git. Both halves are
      # emitted only when set, so empty defers to the app's own fallback rather than overriding it
      # with `""`. A real deployment supplies both.
      user: ""
      pass: ""
      timeout: "90000"
      servers: "nats://nats.nats.svc.cluster.local:4222"
    # **********************
    # OAuth Information
    # **********************
    # Google
    google:
      client:
        id: ""
        secret: ""
        redirectUri: "https://landau.ir/oauth"
    # **********************
    # Telemetry Services
    # **********************
    # OpenTelemetry
    otlp:
      port: "4318"
      host: "jaeger-instance-collector.opentelemetry.svc.cluster.local"
    # **********************
    # APM Service
    # **********************
    # Elastic APM
    apm:
      serverUrl: ""
      secretToken: ""
      verifyServerCert: "false"
    # **********************
    # Wenex Coworkers
    # **********************
    coworkers: [] # list of coworkers
  # **********************
  # Client Configuration
  # **********************
  configuration:
    services:
      host: lnd-services.wenex-client.svc.cluster.local
    workers:
      host: lnd-workers.wenex-client.svc.cluster.local
# **********************
# Client Backend
# **********************
assets:
  enabled: false
services:
  enabled: false
workers:
  enabled: false
# **********************
# Client Frontend
# **********************
frontend:
  enabled: false
  image:
    repository: registry.wenex.org/landau/client-frontend
    tag: "1.0.0"
  imagePullSecrets: []
