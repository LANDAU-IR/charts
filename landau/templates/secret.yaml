{{/*
Minted once, then carried forward.

`lookup` reads the lnd-secrets already in the release's namespace and `lnd.secrets.resolve` keeps
each stored key over a mint — an operator's value under `global.secrets` wins over both. Every key
this template mints goes through that resolver; one that does not is back to minting per upgrade.
Two constraints follow from *how* the chart is applied, and `README.md` names both:

  - `lookup` needs a live cluster. `helm template`, client-side `--dry-run`, and every
    render-then-apply tool — Argo CD is one — see an empty map and mint on every render, and such
    a tool then applies what it rendered over whatever the cluster holds. On that path set the
    three values explicitly (`global.secrets.*`, fed from the tool's own secret store): a supplied
    value is the one step of the order that needs no cluster. The same empty map is why `helm diff`
    and a client-side `--dry-run` show all three changing on every run — that is the render, not
    the cluster; `--dry-run=server` reads the stored values and shows none.
  - The name is fixed and `resource-policy: keep` makes that sharp: the Secret survives
    `helm uninstall` on purpose, so a reinstall under the same release name adopts it, and one
    under another name — or a second release in the namespace — fails Helm's ownership check.
*/}}
{{- $prior := (((lookup "v1" "Secret" .Release.Namespace "lnd-secrets") | default dict).data) | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: lnd-secrets
  annotations:
    # Without this, `helm uninstall` deletes the only copy of a key that is written down nowhere else.
    helm.sh/resource-policy: keep
data:
  AES_KEY: {{ include "lnd.secrets.resolve" (dict "key" "AES_KEY" "value" .Values.global.secrets.aes "prior" $prior) | quote }}
  HMAC_KEY: {{ include "lnd.secrets.resolve" (dict "key" "HMAC_KEY" "value" .Values.global.secrets.altcha.hmacKey "prior" $prior) | quote }}
  # The backend refuses to boot on the secrets this repository ships, so an unset value has to
  # become a minted one rather than a placeholder — same shape as the two keys above.
  PSP_SECRET: {{ include "lnd.secrets.resolve" (dict "key" "PSP_SECRET" "value" .Values.global.secrets.psp.secret "prior" $prior) | quote }}
  {{- with .Values.global.secrets.vapid }}
  {{- if .privateKey }}
  # No generated fallback: a random string is not a valid VAPID key. Unset, the backend keeps its
  # own committed dev pair — set this together with `global.environments.vapid.publicKey`.
  VAPID_PRIVATE_KEY: {{ .privateKey | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.global.secrets.init }}
  {{- if .adminPassword }}
  INIT_LND_ADMIN_PASSWORD: {{ .adminPassword | b64enc | quote }}
  {{- end }}
  {{- end }}
type: Opaque
