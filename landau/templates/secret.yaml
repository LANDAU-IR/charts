apiVersion: v1
kind: Secret
metadata:
  name: lnd-secrets
data:
  AES_KEY: {{ .Values.global.secrets.aes | default (randAlphaNum 16 | sha256sum | trunc 64) | b64enc | quote }}
  HMAC_KEY: {{ .Values.global.secrets.altcha.hmacKey | default (randAlphaNum 16 | sha256sum | trunc 64) | b64enc | quote }}
  # The backend refuses to boot on the secrets this repository ships, so an unset value has to
  # become a minted one rather than a placeholder — same shape as the two keys above.
  PSP_SECRET: {{ .Values.global.secrets.psp.secret | default (randAlphaNum 16 | sha256sum | trunc 64) | b64enc | quote }}
  {{- with .Values.global.secrets.vapid }}
  {{- if .privateKey }}
  # No generated fallback: a random string is not a valid VAPID key. Unset, the backend keeps its
  # own committed dev pair — set this together with `global.environments.vapid.publicKey`.
  VAPID_PRIVATE_KEY: {{ .privateKey | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.global.secrets.init }}
  {{- if .adminPassword }}
  INIT_LND_ADMIN_PASSWORD: {{ .adminPassword | b64enc | quote }}
  {{- end }}
  {{- end }}
type: Opaque
