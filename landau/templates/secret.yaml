{{/*
Minted once, then never again.

`randAlphaNum` runs on **every render**, so before 2026-09-07 this file generated a fresh AES key,
altcha HMAC key and PSP callback secret on every `helm upgrade` — with empty values, which is what
the chart ships. Two renders of identical inputs produced different keys, and the consequences are
not symmetrical: rotating `AES_KEY` makes every value the backend has already encrypted
undecryptable, and rotating `PSP_SECRET` invalidates the signature on every payment callback still
in flight. Nothing announced either; the upgrade reported success.

`lnd.secrets.resolve` now takes an operator value first, else the value already in the cluster,
else mints — and **refuses** if the Secret exists but the key does not, rather than minting over it.

Two constraints this does not remove, both about *how* the chart is applied:

  - **It depends on `lookup`, which needs a live cluster.** `helm template`, client-side
    `--dry-run`, and anything that renders-then-applies — **Argo CD does exactly this** — see an
    empty map and therefore mint. Under such a tool every sync would rotate all three keys. On that
    deployment path the Secret must be created out of band (or managed by external-secrets) and this
    template left to adopt it, which the resolve order already does.
  - **The name `lnd-secrets` is fixed, and `resource-policy: keep` makes that sharp.** The Secret
    survives `helm uninstall` deliberately, so a reinstall under a *different* release name — or a
    second release of this chart in one namespace — fails Helm's ownership check outright. Same
    release name adopts it cleanly, which is the intended path.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: lnd-secrets
  annotations:
    # Without this, `helm uninstall` deletes the only copy of a key that is written down nowhere
    # else, and the reinstall silently starts encrypting under a different one.
    helm.sh/resource-policy: keep
data:
  {{- include "lnd.secrets.data" . | nindent 2 }}
type: Opaque
